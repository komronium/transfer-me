<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>transfer-me &mdash; download</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <h1 class="title">Download</h1>
    <div class="card">
      <div id="loading" class="muted" style="text-align:center;">Loading&hellip;</div>

      <div id="notFound" class="finished" hidden>
        <div class="check" style="color:var(--danger);">&#10007;</div>
        <h2>File not found</h2>
        <div class="muted">This link is invalid or has expired.</div>
      </div>

      <div id="found" class="finished" hidden>
        <div class="check">&#128190;</div>
        <h2 id="dlName"></h2>
        <div class="muted" id="dlMeta"></div>
        <div class="actions" style="justify-content:center; margin-top:22px;">
          <button id="dlBtn" class="primary">Download</button>
        </div>
        <div class="expiry-note" id="dlExpiry"></div>
      </div>
    </div>
  </div>
  <script src="/assets/js/download.js"></script>
</body>
</html>
