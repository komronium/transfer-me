<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>transfer-me</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <h1 class="title">Send a file</h1>
    <div class="card">
      <div id="dropzone" class="dropzone">
        <div class="icon">&#8593;</div>
        <div class="primary">Drop file here</div>
        <div class="secondary">or click to choose a file</div>
        <input id="fileInput" type="file">
      </div>
      <div class="hint" id="sizeHint">Up to 10 GB</div>

      <div id="progressView" class="progress-view" hidden>
        <div class="file-row">
          <div class="name" id="pvName"></div>
          <div class="size" id="pvSize"></div>
        </div>
        <div class="bar-track"><div class="bar-fill" id="pvBar"></div></div>
        <div class="stats">
          <span id="pvPercent">0%</span>
          <span id="pvSpeed">&mdash;</span>
          <span id="pvEta">&mdash;</span>
        </div>
        <div id="pvError" class="error-box" hidden></div>
        <div class="actions">
          <button id="pvCancel" class="secondary">Cancel</button>
          <button id="pvPauseResume" class="secondary">Pause</button>
        </div>
      </div>

      <div id="finishedView" class="finished" hidden>
        <div class="check">&#10003;</div>
        <h2>File ready</h2>
        <div class="muted">Share this link</div>
        <div class="link-box">
          <input id="shareLink" type="text" readonly>
          <button id="copyBtn" class="secondary">Copy</button>
        </div>
        <div class="expiry-note" id="expiryNote"></div>
        <div class="actions" style="justify-content:center; margin-top:18px;">
          <button id="sendAnother" class="primary">Send another file</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/js/upload.js"></script>
</body>
</html>
